spring:
  datasource:
    url: jdbc:mysql://localhost:3307/seed
    username:
    password:

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.sayyoung.seed: DEBUG
    org.hibernate.SQL: DEBUG